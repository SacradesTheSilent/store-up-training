function pickBadgeText(hexBg) {
  const h = hexBg.replace("#", "");
  const r = parseInt(h.substring(0, 2), 16) / 255;
  const g = parseInt(h.substring(2, 4), 16) / 255;
  const b = parseInt(h.substring(4, 6), 16) / 255;
  const lin = (c) => (c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
  const luminance = 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
  const contrastWithWhite = (1.0 + 0.05) / (luminance + 0.05);
  return contrastWithWhite >= 3.0 ? "#FFFFFF" : "#1A1D21";
}

let _supabaseClient = null;
let _supabaseLoadPromise = null;
function loadSupabaseClient() {
  if (_supabaseClient) return Promise.resolve(_supabaseClient);
  if (_supabaseLoadPromise) return _supabaseLoadPromise;
  _supabaseLoadPromise = new Promise((resolve) => {
    if (typeof window === "undefined") { resolve(null); return; }
    if (window.supabase) {
      _supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      resolve(_supabaseClient);
      return;
    }
    const script = document.createElement("script");
    script.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js";
    script.onload = () => {
      _supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      resolve(_supabaseClient);
    };
    script.onerror = () => resolve(null);
    document.head.appendChild(script);
  });
  return _supabaseLoadPromise;
}

async function getCurrentSession() {
  const client = await loadSupabaseClient();
  if (!client) return null;
  const { data } = await client.auth.getSession();
  return data ? data.session : null;
}

async function saveCertResult({ name, store, examType, score, pass, correct, total }) {
  const session = await getCurrentSession();
  if (!session) return { error: "No active session" };
  try {
    const res = await fetch(EDGE_FUNCTION_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${session.access_token}` },
      body: JSON.stringify({ name, store, examType, score, pass, correct, total }),
    });
    const json = await res.json();
    if (!res.ok) return { error: json.error || "Failed to save" };
    return { success: true };
  } catch (e) {
    return { error: String(e) };
  }
}

async function fetchOwnProfile() {
  const client = await loadSupabaseClient();
  const session = await getCurrentSession();
  if (!client || !session) return null;
  const { data, error } = await client.from("profiles").select("*").eq("id", session.user.id).single();
  if (error) return null;
  return data;
}

async function fetchOwnCertHistory() {

}

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }
function canonicalSizeToken(tok) {
  if (["S", "SM", "SMALL"].includes(tok)) return "S";
  if (["M", "MED", "MEDIUM"].includes(tok)) return "M";
  if (["L", "LG", "LRG", "LARGE"].includes(tok)) return "L";
  if (tok === "XL") return "XL";
  return null;
}
function parseSizesInput(str) {
  let s = str.toUpperCase().replace(/EXTRA[\s-]*LARGE/g, "XL").replace(/X[\s-]*LARGE/g, "XL");
  const tokens = s.split(/[^A-Z]+/).filter(Boolean);
  const set = new Set();
  for (const tok of tokens) {
    const canon = canonicalSizeToken(tok);
    if (canon) set.add(canon);
  }
  return set;
}
function sizesSetEqual(a, b) {
  if (a.size !== b.size) return false;
  for (const v of a) if (!b.has(v)) return false;
  return true;
}
function weightedPick(pairs) {
  const total = pairs.reduce((s, [, w]) => s + w, 0);
  let r = Math.random() * total;
  for (const [v, w] of pairs) {
    if (r < w) return v;
    r -= w;
  }
  return pairs[pairs.length - 1][0];
}

  const set = new Set([String(correct)]);

    set.add(String(v));
  }
  return shuffle(Array.from(set));
}

  const tier = weightedPick(availableTierWeights);
  const ingredient = pick(group.members);
  const answer = group.tiers[tier][size];
  const sameSizeOtherTiers = tierKeys.filter((t) => t !== tier).map((t) => group.tiers[t][size]);
  const crossGroup = pick(PORTION_GROUPS.filter((g) => g.key !== group.key));
  const crossTierKeys = Object.keys(crossGroup.tiers);
  const crossTier = crossTierKeys.includes(tier) ? tier : pick(crossTierKeys);
  const crossValue = crossGroup.tiers[crossTier][size];
  const pool = [...sameSizeOtherTiers, crossValue, roundTo1(answer * 1.3)].filter((v) => v !== null && v !== undefined);
  const choices = uniqueChoices(answer, pool);
  return { type: "Portion Recall", kind: "mc", data: { ingredient, unit: group.unit, context: `${size}" Pizza — ${tier}`, answer: String(answer), choices } };
}
function genPanBuildMC() {
  const item = pick(PAN_BUILD.items);
  const answer = item.value;
  const others = PAN_BUILD.items.filter((i) => i.name !== item.name).map((i) => i.value);
  const pool = [...others, roundTo1(answer * 1.3)];
  const choices = uniqueChoices(answer, pool);

function genFlatCheese() {

];

const CATEGORY_BASE_WEIGHTS = { codes: 40, portions: 30, cheese: 12, crust: 10, builds: 8 };
const DEFAULT_ENABLED_CATEGORIES = { codes: true, portions: true, cheese: true, crust: true, builds: true };

function generateRandomQuestion(enabledCategories) {
  const enabled = enabledCategories || DEFAULT_ENABLED_CATEGORIES;
  let keys = Object.keys(CATEGORY_GENERATORS).filter((k) => enabled[k]);
  if (keys.length === 0) keys = Object.keys(CATEGORY_GENERATORS);
  const pairs = keys.map((k) => [k, CATEGORY_BASE_WEIGHTS[k]]);
  const chosenKey = weightedPick(pairs);
  return CATEGORY_GENERATORS[chosenKey]();
}
function questionIdentity(q) {
  if (q.type === "Portion Recall") return `${q.type}|${q.data.ingredient}|${q.data.context}`;
  if (q.type === "Crust & Size") return `${q.type}|${q.data.crust}`;
  if (q.type === "Specialty Build") return `${q.type}|${q.data.name}`;
  return `${q.type}|${q.data.code || q.data.name}`;
}
function generateNonRepeatingQuestion(prevQuestion, enabledCategories) {
  let q = generateRandomQuestion(enabledCategories);
  let attempts = 0;
  while (prevQuestion && questionIdentity(q) === questionIdentity(prevQuestion) && attempts < 6) {
    q = generateRandomQuestion(enabledCategories);
    attempts++;
  }
  return q;
}

const SAUCE_TILES = TOPPING_TILES.filter((t) => ["Pizza Sauce", "Alfredo Sauce", "BBQ Sauce", "Ranch", "Garlic Parm Sauce"].includes(t.label));

function sampleWithoutReplacement(arr, n) {
  const shuffled = shuffle(arr);
  if (n <= shuffled.length) return shuffled.slice(0, n);
  const out = [];
  while (out.length < n) out.push(...shuffle(arr));
  return out.slice(0, n);
}
function weightedSampleWithoutReplacement(pairs, n) {
  let pool = [...pairs];
  const chosen = [];
  const count = Math.min(n, pool.length);
  for (let i = 0; i < count; i++) {
    const picked = weightedPick(pool);
    chosen.push(picked);
    pool = pool.filter(([item]) => item !== picked);
  }
  while (chosen.length < n) chosen.push(pick(pairs.map(([item]) => item)));
  return chosen;
}
function sizeWeight(size) {
  const found = SIZE_WEIGHTS.find(([s]) => s === size);
  return found ? found[1] : 10;
}
function tierWeight(tier) {
  const found = TIER_WEIGHTS.find(([t]) => t === tier);
  return found ? found[1] : 10;
}
function makeCodeTypeQ(tile) {
  return { type: "Code Recall", kind: "type", data: { name: tile.label, answer: tile.code } };
}
function makeReverseCodeTypeQ(tile) {
  return { type: "Ticket Reading", kind: "type", data: { code: tile.code, answer: tile.label } };
}
function makeCrustTypeQ(row) {
  return { type: "Crust & Size", kind: "type", data: { crust: row.crust, sizes: row.sizes } };
}
function enumeratePortionCombos(groups) {
  const combos = [];
  for (const group of groups) {
    for (const tier of Object.keys(group.tiers)) {
      for (const size of SIZES) {
        for (const member of group.members) {
          combos.push({ ingredient: member, unit: group.unit, tier, size, answer: group.tiers[tier][size] });
        }
      }
    }
  }
  return combos;
}
function weightedPortionCombos(groups) {
  return enumeratePortionCombos(groups).map((c) => [c, tierWeight(c.tier) * sizeWeight(c.size)]);
}
function makePortionTypeQFromCombo(c) {
  return { type: "Portion Recall", kind: "type", data: { ingredient: c.ingredient, unit: c.unit, context: `${c.size}" Pizza — ${c.tier}`, answer: String(c.answer) } };
}
function enumerateFlatCheeseCombos() {
  const combos = [];
  for (const item of FLAT_CHEESE) {
    for (const size of SIZES) {
      combos.push({ ingredient: item.name, unit: item.unit, size, answer: item.sizes[size] });
    }
  }
  return combos;
}
function weightedFlatCheeseCombos() {
  return enumerateFlatCheeseCombos().map((c) => [c, sizeWeight(c.size)]);
}
function makeFlatCheeseTypeQFromCombo(c) {
  return { type: "Portion Recall", kind: "type", data: { ingredient: c.ingredient, unit: c.unit, context: `${c.size}" Pizza — All Pizzas`, answer: String(c.answer) } };
}

const NEWHIRE_PORTION_GROUPS = PORTION_GROUPS.filter((g) => g.key === "sliced-meats" || g.key === "heavy-toppings");

function generateNewHireCert() {
  const crustQs = weightedSampleWithoutReplacement(CRUST_WEIGHTED_PAIRS, 4).map(makeCrustTypeQ);
  const sauceQs = sampleWithoutReplacement(SAUCE_TILES, 3).map((t) => (Math.random() < 0.5 ? makeCodeTypeQ(t) : makeReverseCodeTypeQ(t)));
  const portionQs = weightedSampleWithoutReplacement(weightedPortionCombos(NEWHIRE_PORTION_GROUPS), 8).map(makePortionTypeQFromCombo);
  return shuffle([...crustQs, ...sauceQs, ...portionQs]);
}

const TOPPING_CODE_TILES = CODES.filter((t) => !SAUCE_TILES.includes(t));

function generateCSRCert() {
  const toppingCodeQs = sampleWithoutReplacement(TOPPING_CODE_TILES, 10).map((t) => (Math.random() < 0.5 ? makeCodeTypeQ(t) : makeReverseCodeTypeQ(t)));
  const sauceCodeQs = sampleWithoutReplacement(SAUCE_TILES, 2).map((t) => (Math.random() < 0.5 ? makeCodeTypeQ(t) : makeReverseCodeTypeQ(t)));
  const portionQs = weightedSampleWithoutReplacement(weightedPortionCombos(PORTION_GROUPS), 8).map(makePortionTypeQFromCombo);
  const flatCheeseQs = weightedSampleWithoutReplacement(weightedFlatCheeseCombos(), 2).map(makeFlatCheeseTypeQFromCombo);
  const crustQs = weightedSampleWithoutReplacement(CRUST_WEIGHTED_PAIRS, 2).map(makeCrustTypeQ);
  const buildQs = sampleWithoutReplacement(SPECIALTY_BUILDS, 3).map((b) => ({ type: "Specialty Build", kind: "build", data: b }));
  return shuffle([...toppingCodeQs, ...sauceCodeQs, ...portionQs, ...flatCheeseQs, ...crustQs, ...buildQs]);
}

function useCountdown(seconds, active, onExpire) {
  const [timeLeft, setTimeLeft] = useState(seconds);
  const expiredRef = useRef(false);

  useEffect(() => {
    setTimeLeft(seconds);
    expiredRef.current = false;
  }, [seconds, active]);

  useEffect(() => {
    if (!active) return;
    if (timeLeft <= 0) {
      if (!expiredRef.current) {
        expiredRef.current = true;
        onExpire();
      }
      return;
    }
    const t = setTimeout(() => setTimeLeft((v) => v - 1), 1000);
    return () => clearTimeout(t);
  }, [timeLeft, active, onExpire]);

  return timeLeft;
}

function TimerRing({ timeLeft, total }) {
  const pct = Math.max(0, timeLeft / total);
  const r = 26;
  const circ = 2 * Math.PI * r;
  const urgent = timeLeft <= 3;
  return (
    <div style={{ position: "relative", width: 64, height: 64, flexShrink: 0 }}>
      <svg width="64" height="64" viewBox="0 0 64 64" style={{ transform: "rotate(-90deg)" }}>
        <circle cx="32" cy="32" r={r} fill="none" stroke={C.track} strokeWidth="6" />
        <circle cx="32" cy="32" r={r} fill="none" stroke={urgent ? C.red : C.blue} strokeWidth="6" strokeDasharray={circ} strokeDashoffset={circ * (1 - pct)} strokeLinecap="round" style={{ transition: "stroke-dashoffset 1s linear, stroke 0.3s" }} />
      </svg>
      <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 900, fontSize: 18, color: urgent ? C.red : C.white, animation: urgent ? "pulse 1s infinite" : "none" }}>
        {timeLeft}
      </div>
    </div>
  );
}

function CodeTypeQuestion({ item, shellProps, onAnswer }) {
  const [value, setValue] = useState("");
  const [flash, setFlash] = useState(null);
  const [locked, setLocked] = useState(false);
  const inputRef = useRef(null);
  const revealAnswer = shellProps.revealAnswer;

  useEffect(() => { inputRef.current && inputRef.current.focus(); }, []);

  const submit = useCallback((val) => {
    if (locked) return;
    setLocked(true);
    const correct = val.trim().toUpperCase() === item.answer.toUpperCase();
    setFlash(correct ? "correct" : "wrong");
    setTimeout(() => onAnswer(correct), !correct && revealAnswer ? 1800 : 700);
  }, [locked, item.answer, onAnswer, revealAnswer]);

  const handleExpire = useCallback(() => submit(value), [submit, value]);
  const timeLeft = useCountdown(15, !locked, handleExpire);

  return (
    <QuestionShell {...shellProps}>
      <FeedbackFlash status={flash} correctAnswer={revealAnswer ? item.answer : null} />
      <div style={{ display: "flex", alignItems: "center", gap: 16, marginBottom: 24 }}>
        <TimerRing timeLeft={timeLeft} total={15} />
        <div>
          <p style={{ color: C.textMuted, fontSize: 12, textTransform: "uppercase", letterSpacing: "0.05em", fontWeight: 700, margin: 0 }}>Type the code for</p>
          <p style={{ fontSize: 26, fontWeight: 900, color: C.white, margin: 0 }}>{item.name}</p>
        </div>
      </div>
      <input
        ref={inputRef}
        value={value}
        onChange={(e) => setValue(e.target.value)}
        onKeyDown={(e) => { if (e.key === "Enter") submit(value); }}
        disabled={locked}
        maxLength={10}
        style={{ width: "100%", background: C.panel, border: `2px solid ${C.panelBorder}`, borderRadius: 6, padding: "16px", color: C.white, fontSize: 28, fontWeight: 900, letterSpacing: "0.3em", textAlign: "center", textTransform: "uppercase", outline: "none" }}
        placeholder="CODE"
      />
      <button type="button" onClick={() => submit(value)} disabled={locked} style={{ marginTop: 16, width: "100%", background: C.blue, color: "white", fontWeight: 700, padding: "12px 0", borderRadius: 4, border: "none", cursor: locked ? "default" : "pointer", opacity: locked ? 0.6 : 1, fontSize: 16 }}>
        Submit
      </button>
    </QuestionShell>
  );
}

function BuildQuestion({ item, shellProps, onAnswer }) {
  const [selected, setSelected] = useState([]);
  const [flash, setFlash] = useState(null);
  const [locked, setLocked] = useState(false);
  const revealAnswer = shellProps.revealAnswer;

  const evaluate = useCallback((sel) => {
    if (locked) return;
    setLocked(true);
    const correctSet = [...item.correct].sort().join(",");
    const selSet = [...sel].sort().join(",");
    const correct = correctSet === selSet;
    setFlash(correct ? "correct" : "wrong");
    setTimeout(() => onAnswer(correct), !correct && revealAnswer ? 2600 : 800);
  }, [locked, item.correct, onAnswer, revealAnswer]);

  const handleExpire = useCallback(() => evaluate(selected), [evaluate, selected]);
  const timerSeconds = Math.max(20, Math.round(item.correct.length * 2.5));
  const timeLeft = useCountdown(timerSeconds, !locked, handleExpire);

  const toggle = (label) => {
    if (locked) return;
    setSelected((s) => (s.includes(label) ? s.filter((x) => x !== label) : [...s, label]));
  };

  return (
    <QuestionShell {...shellProps}>
      <FeedbackFlash status={flash} correctAnswer={revealAnswer ? item.correct.join(", ") : null} />
      <div style={{ display: "flex", alignItems: "center", gap: 16, marginBottom: 12 }}>
        <TimerRing timeLeft={timeLeft} total={timerSeconds} />
        <div>
          <p style={{ color: C.textMuted, fontSize: 12, textTransform: "uppercase", letterSpacing: "0.05em", fontWeight: 700, margin: 0 }}>Build the order</p>
          <p style={{ color: C.white, fontWeight: 900, fontSize: 20, lineHeight: 1.2, margin: 0 }}>{item.name}</p>
          <p style={{ color: C.textFaint, fontSize: 12, margin: 0 }}>{item.subtitle}</p>
        </div>
      </div>

      <div style={{ position: "relative", width: 176, height: 176, margin: "0 auto 20px" }}>
        <div style={{ position: "absolute", inset: 0, borderRadius: "50%", background: "radial-gradient(circle at 50% 45%, #E8B25C 0%, #D99A3E 55%, #C67F2A 100%)" }} />
        <div style={{ position: "absolute", inset: 11, borderRadius: "50%", background: C.red, opacity: 0.85 }} />
        <div style={{ position: "absolute", inset: 18, borderRadius: "50%", background: "#F4E4A6", opacity: 0.9 }} />
        <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", flexWrap: "wrap", gap: 4, padding: 36 }}>
          {selected.map((label) => {
            const t = byLabel(label);
            return <div key={label} style={{ width: 14, height: 14, borderRadius: "50%", background: t ? t.color : "#999", border: "1px solid rgba(0,0,0,0.2)" }} />;
          })}
        </div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, maxHeight: 280, overflowY: "auto", paddingRight: 2 }}>
        {TOPPING_TILES.map((t) => {
          const active = selected.includes(t.label);
          return (
            <button key={t.label} onClick={() => toggle(t.label)} disabled={locked} style={{ display: "flex", alignItems: "center", gap: 8, padding: "9px 10px", borderRadius: 6, border: `1px solid ${active ? C.blue : C.panelBorder}`, background: active ? C.blueSoft : C.panel, color: active ? C.white : C.textMuted, fontWeight: 600, fontSize: 13, cursor: locked ? "default" : "pointer", opacity: locked ? 0.6 : 1 }}>
              <span style={{ width: 11, height: 11, borderRadius: "50%", background: t.color, flexShrink: 0, border: "1px solid rgba(0,0,0,0.15)" }} />
              <span style={{ flex: 1 }}>{t.label}</span>
              {t.code && <span style={{ fontSize: 11, fontWeight: 800, color: C.textMuted, background: "rgba(11,30,46,0.05)", padding: "1px 6px", borderRadius: 4 }}>{t.code}</span>}
            </button>
          );
        })}
      </div>

      <button onClick={() => evaluate(selected)} disabled={locked || selected.length === 0} style={{ marginTop: 16, width: "100%", background: C.red, color: "white", fontWeight: 700, padding: "12px 0", borderRadius: 4, border: "none", cursor: locked || selected.length === 0 ? "default" : "pointer", opacity: locked || selected.length === 0 ? 0.4 : 1, fontSize: 16 }}>
        Confirm Build
      </button>
    </QuestionShell>
  );
}

function Results({ user, results, mode, onRestart, onPass, onRetryMissed }) {
  const total = results.length;
  const correct = results.filter((r) => r.correct).length;
  const pct = total > 0 ? Math.round((correct / total) * 100) : 0;
  const isCertMode = mode === "newhire" || mode === "csr";
  const pass = isCertMode ? pct >= 90 : mode === "retry" ? pct === 100 : true;
  const [sent, setSent] = useState(false);
  const missed = results.filter((r) => !r.correct && r.question);
  const examType = mode === "newhire" ? "New Hire" : mode === "csr" ? "CSR" : null;

  const [email, setEmail] = useState("");
  const [magicLinkSent, setMagicLinkSent] = useState(false);
  const [magicLinkError, setMagicLinkError] = useState("");
  const [saveStatus, setSaveStatus] = useState(null);

  useEffect(() => {
    const t = setTimeout(() => setSent(true), 1200);
    return () => clearTimeout(t);
  }, []);

  useEffect(() => {
    if (mode === "newhire" && pass && onPass) onPass();
  }, [mode, pass, onPass]);

  useEffect(() => {
    if (!examType) return;
    let cancelled = false;
    (async () => {
      setSaveStatus("checking");
      const session = await getCurrentSession();
      if (cancelled) return;
      if (session) {
        setSaveStatus("saving");
        const result = await saveCertResult({ name: user.name, store: user.store, examType, score: pct, pass, correct, total });
        if (cancelled) return;
        setSaveStatus(result.success ? "saved" : "error");
      } else {
        setSaveStatus("no-session");
      }
    })();
    return () => { cancelled = true; };
  }, []);

  const handleSendLink = async () => {
    if (!email.trim()) { setMagicLinkError("Enter an email first."); return; }
    setMagicLinkError("");
    const result = await sendMagicLink(email.trim(), { type: "save-cert", payload: { name: user.name, store: user.store, examType, score: pct, pass, correct, total } });
    if (result.success) setMagicLinkSent(true);
    else setMagicLinkError(result.error || "Something went wrong sending that.");
  };

  const title = mode === "retry"
    ? (missed.length === 0 ? "All Cleaned Up!" : "Retry Complete")
    : isCertMode ? (pass ? "Certification Passed" : "Not Yet — Retake Needed") : "Practice Session Complete";
  const subtitle = mode === "newhire" ? "New Hire Certification" : mode === "csr" ? "CSR Certification" : mode === "retry" ? "Missed Question Retry" : "Endless Practice";

  return (
    <div style={{ minHeight: "100vh", padding: "40px 24px", background: C.bg }}>
      <div style={{ maxWidth: 512, margin: "0 auto" }}>
        <div style={{ textAlign: "center", marginBottom: 32 }}>
          <div style={{ width: 96, height: 96, borderRadius: "50%", margin: "0 auto 16px", display: "flex", alignItems: "center", justifyContent: "center", border: `4px solid ${pass ? C.green : C.red}`, background: pass ? C.greenSoft : C.redSoft }}>
            <span style={{ fontSize: 30, fontWeight: 900, color: C.white }}>{pct}%</span>
          </div>
          <h1 style={{ fontSize: 24, fontWeight: 900, color: C.white, margin: "0 0 4px" }}>{title}</h1>
          <p style={{ color: C.textMuted, fontSize: 14, margin: 0 }}>{correct} of {total} correct · {subtitle}</p>
        </div>

        <div style={{ background: C.panel, border: `1px solid ${C.panelBorder}`, borderRadius: 8, padding: 16, marginBottom: 16 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12 }}>
            <span>✉️</span>
            <span style={{ fontSize: 12, textTransform: "uppercase", letterSpacing: "0.05em", color: C.textMuted, fontWeight: 700 }}>Store Notification</span>
          </div>
          {!sent ? (
            <p style={{ color: C.textFaint, fontSize: 14 }}>Sending results to Store #{user.store}…</p>
          ) : (
            <p style={{ color: C.white, fontSize: 14, margin: 0 }}>
              ✅ Emailed to <span style={{ fontWeight: 600 }}>Store #{user.store}</span> — {user.name} scored {pct}% ({subtitle}).
            </p>
          )}
        </div>

        <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 24, maxHeight: 320, overflowY: "auto" }}>
          {results.map((r, i) => (
            <div key={i} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", background: C.panelDim, borderRadius: 4, padding: "8px 12px", fontSize: 14 }}>
              <span style={{ color: C.textMuted }}>Q{i + 1} · {r.type}</span>
              <span>{r.correct ? "✅" : "❌"}</span>
            </div>
          ))}
        </div>

        {saveStatus === "saved" && (
          <div style={{ background: C.greenSoft, border: `2px solid ${C.green}`, borderRadius: C.cardRadius, padding: "12px 16px", marginBottom: 16, color: C.white, fontSize: 14, fontWeight: 600 }}>
            ✓ Saved to your account
          </div>
        )}
        {saveStatus === "error" && (
          <div style={{ background: C.redSoft, border: `2px solid ${C.red}`, borderRadius: C.cardRadius, padding: "12px 16px", marginBottom: 16, color: C.white, fontSize: 14 }}>
            Couldn't save this to your account — your result still went to the store as usual.
          </div>
        )}

        {mode === "csr" && pass && saveStatus === "no-session" && !magicLinkSent && (
          <div style={{ background: C.panel, border: `2px solid ${C.panelBorder}`, borderRadius: C.cardRadius, padding: 18, marginBottom: 16 }}>
            <p style={{ fontFamily: C.displayFont, fontSize: 20, fontWeight: 700, textTransform: "uppercase", color: C.white, margin: "0 0 4px" }}>Save Your Progress</p>
            <p style={{ color: C.textMuted, fontSize: 13, marginBottom: 12, lineHeight: 1.4 }}>
              You passed CSR — enter your email and we'll send a link to create an account, so this and future results are saved.
            </p>
            <input
              value={email}
              onChange={(e) => setEmail(e.target.value)}
              placeholder="you@email.com"
              style={{ width: "100%", background: C.bg, border: `1px solid ${C.panelBorder}`, borderRadius: 4, padding: "10px 12px", color: C.white, fontSize: 14, outline: "none", marginBottom: 10, boxSizing: "border-box" }}
            />
            {magicLinkError && <p style={{ color: C.errorRed, fontSize: 12, marginBottom: 8 }}>{magicLinkError}</p>}
            <button onClick={handleSendLink} style={{ width: "100%", background: C.blue, color: "white", fontWeight: 700, padding: "11px 0", borderRadius: C.btnRadius, border: "none", cursor: "pointer", fontSize: 16 }}>
              Send Magic Link
            </button>
          </div>
        )}
        {magicLinkSent && (
          <div style={{ background: C.blueSoft, border: `2px solid ${C.blue}`, borderRadius: C.cardRadius, padding: "12px 16px", marginBottom: 16, color: C.white, fontSize: 14 }}>
            Check your email for the link — come back and this result saves automatically.
          </div>
        )}

        {missed.length > 0 && (mode === "endless" || mode === "retry") && (
          <button
            onClick={() => onRetryMissed(missed.map((r) => r.question))}
            style={{ width: "100%", background: C.purpleSoft, color: C.purple, fontWeight: 700, padding: "12px 0", borderRadius: 4, border: `1px solid ${C.purple}`, cursor: "pointer", marginBottom: 10, fontSize: 16 }}
          >
            Retry the {missed.length} You Missed
          </button>
        )}

        <button onClick={onRestart} style={{ width: "100%", background: C.blue, color: "white", fontWeight: 700, padding: "12px 0", borderRadius: 4, border: "none", cursor: "pointer", fontSize: 16 }}>
          {isCertMode && !pass ? "Retake Course" : "Back to Dashboard"}
        </button>
      </div>
    </div>
  );
}

function renderQuestion(q, shellProps, onAnswer) {
  const key = shellProps.index;
  if (q.kind === "type" && q.type === "Code Recall") return <CodeTypeQuestion key={key} item={q.data} shellProps={shellProps} onAnswer={onAnswer} />;
  if (q.kind === "mc" && q.type === "Ticket Reading") return <CodeMCQuestion key={key} item={q.data} shellProps={shellProps} onAnswer={onAnswer} />;
  if (q.kind === "type" && q.type === "Ticket Reading") return <CodeNameTypeQuestion key={key} item={q.data} shellProps={shellProps} onAnswer={onAnswer} />;
  if (q.kind === "mc" && q.type === "Crust & Size") return <CrustMCQuestion key={key} item={q.data} shellProps={shellProps} onAnswer={onAnswer} />;
  if (q.kind === "type" && q.type === "Crust & Size") return <CrustTypeQuestion key={key} item={q.data} shellProps={shellProps} onAnswer={onAnswer} />;
  if (q.kind === "mc" && q.type === "Portion Recall") return <PortionMCQuestion key={key} item={q.data} shellProps={shellProps} onAnswer={onAnswer} />;
  if (q.kind === "type" && q.type === "Portion Recall") return <PortionTypeQuestion key={key} item={q.data} shellProps={shellProps} onAnswer={onAnswer} />;
  if (q.kind === "build") return <BuildQuestion key={key} item={q.data} shellProps={shellProps} onAnswer={onAnswer} />;
  return null;
}

  const [endlessQueue, setEndlessQueue] = useState([]);
  const [certQuestions, setCertQuestions] = useState(null);
  const [studyGuideViewed, setStudyGuideViewed] = useState(false);
  const [newHirePassed, setNewHirePassed] = useState(false);
  const [enabledCategories, setEnabledCategories] = useState(DEFAULT_ENABLED_CATEGORIES);
  const [isDark, setIsDark] = useState(function () {
    try { return localStorage.getItem("storeup-dark") === "1"; } catch (e) { return false; }
  });
  const [seenTimerWarning, setSeenTimerWarning] = useState(() => hasSeenTimerWarning());
  const [pendingStartFn, setPendingStartFn] = useState(null);
  const [hasAccountSession, setHasAccountSession] = useState(false);

  }, [isDark]);

  const refreshAccountSession = async () => {
    const session = await getCurrentSession();
    setHasAccountSession(!!session);
    return !!session;
  };

  const [pendingSaveResult, setPendingSaveResult] = useState(null);
  useEffect(() => {
    let cancelled = false;
    (async () => {
      const intent = readStashedIntent();
      if (!intent) {
        const hasSession = await refreshAccountSession();
        if (hasSession) {
          const profile = await fetchOwnProfile();
          if (!cancelled && profile) {
            setUser({ name: profile.name, store: profile.store, role: "New Hire" });
            setScreen("dashboard");
          }
        }
        return;
      }
      const session = await getCurrentSession();
      if (cancelled) return;
      if (!session) return;
      if (intent.type === "save-cert") {
        const result = await saveCertResult(intent.payload);
        if (cancelled) return;
        if (result.success) {
          clearStashedIntent();
          setPendingSaveResult(intent.payload);
          await refreshAccountSession();
        }
      } else if (intent.type === "sign-in") {
        clearStashedIntent();
        if (cancelled) return;
        await refreshAccountSession();
        const profile = await fetchOwnProfile();
        if (cancelled) return;
        if (profile) {
          setUser({ name: profile.name, store: profile.store, role: "New Hire" });
        }
        setScreen("account");
      }
    })();
    return () => { cancelled = true; };
  }, []);

  const toggleCategory = (key) => {
    setEnabledCategories((prev) => {
      const activeCount = Object.values(prev).filter(Boolean).length;
      if (prev[key] && activeCount <= 1) return prev;
      return { ...prev, [key]: !prev[key] };
    });
  };

  const startStudy = () => setScreen("studyguide");
  const finishStudy = () => {
    setStudyGuideViewed(true);
    setScreen("dashboard");
  };

  const startNewHire = () => {
    clearResumeState();
    setResumeStateVal(null);
    setMode("newhire");
    setQIndex(0);
    setResults([]);
    setCertQuestions(generateNewHireCert());
    setScreen("quiz");
  };

  const startCSR = () => {
    if (!newHirePassed) return;
    clearResumeState();
    setResumeStateVal(null);
    setMode("csr");
    setQIndex(0);
    setResults([]);
    setCertQuestions(generateCSRCert());
    setScreen("quiz");
  };

  const startEndless = () => {
    setMode("endless");
    setQIndex(0);
    setResults([]);
    setEndlessQueue([generateRandomQuestion(enabledCategories)]);
    setScreen("quiz");
  };

  const startRetry = (missedQuestions) => {
    setMode("retry");
    setQIndex(0);
    setResults([]);
    setCertQuestions(missedQuestions);
    setScreen("quiz");
  };

  const guardedStart = (fn) => () => {
    if (seenTimerWarning) { fn(); return; }
    setPendingStartFn(() => fn);
    setScreen("timerwarning");
  };
  const acknowledgeTimerWarning = () => {
    markTimerWarningSeen();
    setSeenTimerWarning(true);
    const fn = pendingStartFn;
    setPendingStartFn(null);
    if (fn) fn();
  };

  const resumeCert = () => {
    if (!resumeState) return;
    setMode(resumeState.mode);
    setCertQuestions(resumeState.certQuestions);
    setQIndex(resumeState.qIndex);
    setResults(resumeState.results);
    setScreen("quiz");
  };
  const discardResume = () => {
    clearResumeState();
    setResumeStateVal(null);
  };

  const fixedQuestions = mode === "newhire" || mode === "csr" || mode === "retry" ? certQuestions : null;
  const currentQuestion = fixedQuestions ? fixedQuestions[qIndex] : endlessQueue[qIndex];

  const handleAnswer = (correct) => {
    const q = currentQuestion;
    const next = [...results, { type: q.type, correct, question: q }];
    setResults(next);
    if (fixedQuestions) {
      const nextIndex = qIndex + 1;
      if (nextIndex < fixedQuestions.length) {
        setQIndex(nextIndex);
        if (mode === "newhire" || mode === "csr") {
          saveResumeState(mode, fixedQuestions, nextIndex, next);
        }
      } else {
        if (mode === "newhire" || mode === "csr") {
          clearResumeState();
          setResumeStateVal(null);
        }
        setScreen("results");
      }
    } else {
      setEndlessQueue((prev) => [...prev, generateNonRepeatingQuestion(q, enabledCategories)]);
      setQIndex(qIndex + 1);
    }
  };

  const endSession = () => setScreen("results");

  const correctCount = results.filter((r) => r.correct).length;
  const wrongCount = results.length - correctCount;

  return (
    <div style={{ width: "100%", minHeight: "100vh" }}>
      {pendingSaveResult ? (
        <MagicLinkConfirmation result={pendingSaveResult} onContinue={() => setPendingSaveResult(null)} />
      ) : (
        <React.Fragment>
          {screen === "login" && (
            <Login
              onLogin={(u) => { setPendingLogin(u); setScreen("confirmstore"); }}
              initialName={pendingLogin && pendingLogin.name}
              initialStore={pendingLogin && pendingLogin.store}
            />
          )}
          {screen === "confirmstore" && pendingLogin && (
            <ConfirmStore
              name={pendingLogin.name}
              store={pendingLogin.store}
              onBack={() => setScreen("login")}
              onConfirm={() => {
                setUser({ name: pendingLogin.name, store: pendingLogin.store, role: "New Hire" });
                setScreen("dashboard");
              }}
            />
          )}
          {screen === "dashboard" && user && (
            <Dashboard
              user={user}
              studyGuideViewed={studyGuideViewed}
              newHirePassed={newHirePassed}
              isDark={isDark}
              onToggleDark={() => setIsDark((d) => !d)}
              onStartStudy={startStudy}
              onStartNewHire={guardedStart(startNewHire)}
              onStartCSR={guardedStart(startCSR)}
              onStartEndless={guardedStart(startEndless)}
              hasAccountSession={hasAccountSession}
              onViewAccount={() => setScreen("account")}
              resumeState={resumeState}
              onResume={resumeCert}
              onDiscardResume={discardResume}
            />
          )}
          {screen === "studyguide" && <StudyGuide onFinish={finishStudy} onExit={() => setScreen("dashboard")} />}
          {screen === "timerwarning" && (
            <TimerWarningScreen onContinue={acknowledgeTimerWarning} onBack={() => { setPendingStartFn(null); setScreen("dashboard"); }} />
          )}
          {screen === "account" && (
            <AccountScreen onBack={() => setScreen("dashboard")} />
          )}
          {screen === "quiz" && currentQuestion && renderQuestion(
            currentQuestion,
            { index: qIndex, total: fixedQuestions ? fixedQuestions.length : null, correctCount, wrongCount, onEndSession: mode === "endless" ? endSession : null, extraHeader: mode === "endless" ? <CategoryToggles enabled={enabledCategories} onToggle={toggleCategory} /> : null, revealAnswer: mode === "endless" || mode === "retry" },
            handleAnswer
          )}
          {screen === "results" && user && (
            <Results user={user} results={results} mode={mode} onRestart={() => setScreen("dashboard")} onPass={() => setNewHirePassed(true)} onRetryMissed={startRetry} />
          )}
        </React.Fragment>
      )}
    </div>
  );
}

function MagicLinkConfirmation({ result, onContinue }) {
  return (
    <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", padding: "48px 20px", background: C.bg }}>
      <div style={{ width: "100%", maxWidth: 400, background: C.panel, border: `2px solid ${C.panelBorder}`, borderRadius: C.cardRadius, padding: 30, textAlign: "center" }}>
        <p style={{ fontSize: 40, margin: "0 0 12px" }}>✓</p>
        <h1 style={{ fontFamily: C.displayFont, fontSize: 26, fontWeight: 800, color: C.white, margin: "0 0 8px", textTransform: "uppercase" }}>Account Created</h1>
        <p style={{ color: C.textMuted, fontSize: 14, marginBottom: 20, lineHeight: 1.5 }}>
          {result.name}, your {result.examType} result ({result.score}%) is saved. Your store will review and activate your account.
        </p>
        <button onClick={onContinue} style={{ width: "100%", background: C.blue, color: "white", fontWeight: 800, fontSize: 15, padding: "13px 0", borderRadius: C.btnRadius, border: "none", cursor: "pointer" }}>
          Continue
        </button>
      </div>
    </div>
  );
}

function TimerWarningScreen({ onContinue, onBack }) {
  return (
    <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", padding: "48px 20px", background: C.bg }}>
      <div style={{ width: "100%", maxWidth: 400, background: C.panel, border: `2px solid ${C.panelBorder}`, borderRadius: C.cardRadius, padding: 30, textAlign: "center" }}>
        <p style={{ fontSize: 40, margin: "0 0 12px" }}>⏱</p>
        <h1 style={{ fontFamily: C.displayFont, fontSize: 26, fontWeight: 800, color: C.white, margin: "0 0 10px", textTransform: "uppercase" }}>Heads Up — It's Timed</h1>
        <p style={{ color: C.textMuted, fontSize: 14, marginBottom: 20, lineHeight: 1.6 }}>
          Most questions give you 10–15 seconds to answer, and specialty builds get a bit more. Don't worry about missing a few — that's normal. Answer as fast as you can and keep moving.
        </p>
        <button onClick={onContinue} style={{ width: "100%", background: C.blue, color: "white", fontWeight: 800, fontSize: 15, padding: "13px 0", borderRadius: C.btnRadius, border: "none", cursor: "pointer", marginBottom: 10 }}>
          Got It — Let's Go
        </button>
        <button onClick={onBack} style={{ width: "100%", background: "transparent", color: C.textMuted, fontWeight: 700, fontSize: 14, padding: "10px 0", borderRadius: C.btnRadius, border: "none", cursor: "pointer" }}>
          ← Not Yet
        </button>
      </div>
    </div>
  );
}

function AccountScreen({ onBack }) {
  const [loading, setLoading] = useState(true);
  const [profile, setProfile] = useState(null);
  const [history, setHistory] = useState([]);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      const results = await Promise.all([fetchOwnProfile(), fetchOwnCertHistory()]);
      if (cancelled) return;
      setProfile(results[0]);
      setHistory(results[1]);
      setLoading(false);
    })();
    return () => { cancelled = true; };
  }, []);

  return (
    <div style={{ minHeight: "100vh", padding: "40px 24px", background: C.bg }}>
      <div style={{ maxWidth: 512, margin: "0 auto" }}>
        <button onClick={onBack} style={{ background: "none", border: "none", color: C.textMuted, fontSize: 13, fontWeight: 700, cursor: "pointer", padding: 0, marginBottom: 20 }}>
          ← Back
        </button>

        {loading ? (
          <p style={{ color: C.textMuted, fontSize: 14 }}>Loading your account…</p>
        ) : !profile ? (
          <p style={{ color: C.textMuted, fontSize: 14 }}>Couldn't load your account — try signing in again.</p>
        ) : (
          <React.Fragment>
            <h1 style={{ fontFamily: C.displayFont, fontSize: 32, fontWeight: 800, color: C.white, textTransform: "uppercase", margin: "0 0 4px" }}>{profile.name}</h1>
            <p style={{ color: C.textMuted, fontSize: 14, marginBottom: 14 }}>Store {profile.store}</p>
            <div style={{ display: "inline-block", background: profile.activated ? C.greenSoft : C.panelDim, border: `2px solid ${profile.activated ? C.green : C.panelBorder}`, borderRadius: 999, padding: "5px 14px", fontSize: 12, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.04em", color: profile.activated ? C.green : C.textMuted, marginBottom: 28 }}>
              {profile.activated ? "✓ Activated" : "Pending Review"}
            </div>

            <p style={{ fontFamily: C.displayFont, fontSize: 20, fontWeight: 700, textTransform: "uppercase", color: C.white, margin: "0 0 12px" }}>Certification History</p>
            {history.length === 0 ? (
              <p style={{ color: C.textFaint, fontSize: 14 }}>No cert attempts saved yet.</p>
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {history.map((h) => (
                  <div key={h.id} style={{ background: C.panel, border: `2px solid ${C.panelBorder}`, borderRadius: C.cardRadius, padding: "12px 16px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                    <div>
                      <p style={{ color: C.white, fontWeight: 700, margin: 0 }}>{h.exam_type}</p>
                      <p style={{ color: C.textFaint, fontSize: 12, margin: "2px 0 0" }}>{new Date(h.taken_at).toLocaleDateString()}</p>
                    </div>
                    <div style={{ textAlign: "right" }}>
                      <p style={{ fontFamily: C.displayFont, fontSize: 22, fontWeight: 800, color: h.pass ? C.green : C.red, margin: 0 }}>{h.score}%</p>
                      <p style={{ color: C.textFaint, fontSize: 11, margin: 0, textTransform: "uppercase", fontWeight: 700 }}>{h.pass ? "Pass" : "Fail"}</p>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

function pickBadgeText(hexBg) {
  const h = hexBg.replace("#", "");
  const r = parseInt(h.substring(0, 2), 16) / 255;
  const g = parseInt(h.substring(2, 4), 16) / 255;
  const b = parseInt(h.substring(4, 6), 16) / 255;
  const lin = (c) => (c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
  const luminance = 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
  const contrastWithWhite = (1.0 + 0.05) / (luminance + 0.05);
  return contrastWithWhite >= 3.0 ? "#FFFFFF" : "#1A1D21";
}

function withAlpha(hex, alpha) {
  const h = hex.replace("#", "");
  const r = parseInt(h.substring(0, 2), 16);
  const g = parseInt(h.substring(2, 4), 16);
  const b = parseInt(h.substring(4, 6), 16);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }
function canonicalSizeToken(tok) {
  if (["S", "SM", "SMALL"].includes(tok)) return "S";
  if (["M", "MED", "MEDIUM"].includes(tok)) return "M";
  if (["L", "LG", "LRG", "LARGE"].includes(tok)) return "L";
  if (tok === "XL") return "XL";
  return null;
}
function parseSizesInput(str) {
  let s = str.toUpperCase().replace(/EXTRA[\s-]*LARGE/g, "XL").replace(/X[\s-]*LARGE/g, "XL");
  const tokens = s.split(/[^A-Z]+/).filter(Boolean);
  const set = new Set();
  for (const tok of tokens) {
    const canon = canonicalSizeToken(tok);
    if (canon) set.add(canon);
  }
  return set;
}
function sizesSetEqual(a, b) {
  if (a.size !== b.size) return false;
  for (const v of a) if (!b.has(v)) return false;
  return true;
}
function weightedPick(pairs) {
  const total = pairs.reduce((s, [, w]) => s + w, 0);
  let r = Math.random() * total;
  for (const [v, w] of pairs) {
    if (r < w) return v;
    r -= w;
  }
  return pairs[pairs.length - 1][0];
}
const TIER_WEIGHTS = [["1-Topping", 42], ["2-3 Topping", 48], ["4+ Topping", 10]];
const SIZE_WEIGHTS = [[12, 49], [14, 49], [16, 2]];
function uniqueChoices(correct, pool) {
  const set = new Set([String(correct)]);
  for (const v of pool) {
    if (set.size >= 4) break;
    set.add(String(v));
  }
  return shuffle(Array.from(set));
}
function roundTo1(n) {
  return Math.round(n * 10) / 10;
}

function genCodeMC() {
  const item = pick(CODES);
  const others = shuffle(CODES.filter((c) => c.label !== item.label)).slice(0, 3).map((c) => c.label);
  return { type: "Ticket Reading", kind: "mc", data: { code: item.code, answer: item.label, choices: shuffle([item.label, ...others]) } };
}
function genPortionMC() {
  const group = pick(PORTION_GROUPS);
  const size = weightedPick(SIZE_WEIGHTS);
  const tierKeys = Object.keys(group.tiers);
  const availableTierWeights = TIER_WEIGHTS.filter(([t]) => tierKeys.includes(t));
  const tier = weightedPick(availableTierWeights);
  const ingredient = pick(group.members);
  const answer = group.tiers[tier][size];
  const sameSizeOtherTiers = tierKeys.filter((t) => t !== tier).map((t) => group.tiers[t][size]);
  const crossGroup = pick(PORTION_GROUPS.filter((g) => g.key !== group.key));
  const crossTierKeys = Object.keys(crossGroup.tiers);
  const crossTier = crossTierKeys.includes(tier) ? tier : pick(crossTierKeys);
  const crossValue = crossGroup.tiers[crossTier][size];
  const pool = [...sameSizeOtherTiers, crossValue, roundTo1(answer * 1.3)].filter((v) => v !== null && v !== undefined);
  const choices = uniqueChoices(answer, pool);
  return { type: "Portion Recall", kind: "mc", data: { ingredient, unit: group.unit, context: `${size}" Pizza — ${tier}`, answer: String(answer), choices } };
}

  const pool = [...others, roundTo1(answer * 1.3)];

  return { type: "Portion Recall", kind: "mc", data: { ingredient: `${item.name} (Pan)`, unit: item.unit, context: "Pan Pizza — Medium Only", answer: String(answer), choices } };

  const pool = [...otherSizes, crossRow.values[size]];

}
function genFlatCheese() {
  const roll = Math.random();
  if (roll < 0.15) return genPanBuildMC();
  if (roll < 0.35) return genNYBuildMC();
  const item = pick(FLAT_CHEESE);

  const crossItem = pick(FLAT_CHEESE.filter((f) => f.name !== item.name));
  const pool = [...otherSizes, crossItem.sizes[size]];
  const choices = uniqueChoices(answer, pool);
  return { type: "Portion Recall", kind: "mc", data: { ingredient: item.name, unit: item.unit, context: `${size}" Pizza — All Pizzas`, answer: String(answer), choices } };
}

}

];
const CATEGORY_GENERATORS = { codes: genCodeMC, portions: genPortionMC, cheese: genFlatCheese, crust: genCrustMC, builds: genBuild, newitems: genNewItemMC };
const CATEGORY_BASE_WEIGHTS = { codes: 40, portions: 30, cheese: 12, crust: 10, builds: 8, newitems: 10 };
const DEFAULT_ENABLED_CATEGORIES = { codes: true, portions: true, cheese: true, crust: true, builds: true, newitems: true };

function generateRandomQuestion(enabledCategories) {
  const enabled = enabledCategories || DEFAULT_ENABLED_CATEGORIES;
  let keys = Object.keys(CATEGORY_GENERATORS).filter((k) => enabled[k]);
  if (keys.length === 0) keys = Object.keys(CATEGORY_GENERATORS);
  const pairs = keys.map((k) => [k, CATEGORY_BASE_WEIGHTS[k]]);
  const chosenKey = weightedPick(pairs);
  return CATEGORY_GENERATORS[chosenKey]();
}
function questionIdentity(q) {
  if (q.type === "Portion Recall") return `${q.type}|${q.data.ingredient}|${q.data.context}`;
  if (q.type === "Crust & Size") return `${q.type}|${q.data.crust}`;
  if (q.type === "Specialty Build") return `${q.type}|${q.data.name}`;
  if (q.type === "Policy") return `${q.type}|${q.data.prompt}`;
  return `${q.type}|${q.data.code || q.data.name}`;
}
function generateNonRepeatingQuestion(prevQuestion, enabledCategories) {
  let q = generateRandomQuestion(enabledCategories);
  let attempts = 0;
  while (prevQuestion && questionIdentity(q) === questionIdentity(prevQuestion) && attempts < 6) {
    q = generateRandomQuestion(enabledCategories);
    attempts++;
  }
  return q;
}

const SAUCE_TILES = TOPPING_TILES.filter((t) => ["Pizza Sauce", "Alfredo Sauce", "BBQ Sauce", "Ranch", "Garlic Parm Sauce"].includes(t.label));

function sampleWithoutReplacement(arr, n) {
  const shuffled = shuffle(arr);
  if (n <= shuffled.length) return shuffled.slice(0, n);
  const out = [];
  while (out.length < n) out.push(...shuffle(arr));
  return out.slice(0, n);
}
function weightedSampleWithoutReplacement(pairs, n) {
  let pool = [...pairs];
  const chosen = [];
  const count = Math.min(n, pool.length);
  for (let i = 0; i < count; i++) {
    const picked = weightedPick(pool);
    chosen.push(picked);
    pool = pool.filter(([item]) => item !== picked);
  }
  while (chosen.length < n) chosen.push(pick(pairs.map(([item]) => item)));
  return chosen;
}
function sizeWeight(size) {
  const found = SIZE_WEIGHTS.find(([s]) => s === size);
  return found ? found[1] : 10;
}
function tierWeight(tier) {
  const found = TIER_WEIGHTS.find(([t]) => t === tier);
  return found ? found[1] : 10;
}
function makeCodeTypeQ(tile) {
  return { type: "Code Recall", kind: "type", data: { name: tile.label, answer: tile.code } };
}
function makeReverseCodeTypeQ(tile) {
  return { type: "Ticket Reading", kind: "type", data: { code: tile.code, answer: tile.label } };
}
function makeCrustTypeQ(row) {
  return { type: "Crust & Size", kind: "type", data: { crust: row.crust, sizes: row.sizes } };
}
function enumeratePortionCombos(groups) {
  const combos = [];
  for (const group of groups) {
    for (const tier of Object.keys(group.tiers)) {
      for (const size of SIZES) {
        for (const member of group.members) {
          combos.push({ ingredient: member, unit: group.unit, tier, size, answer: group.tiers[tier][size] });
        }
      }
    }
  }
  return combos;
}
function weightedPortionCombos(groups) {
  return enumeratePortionCombos(groups).map((c) => [c, tierWeight(c.tier) * sizeWeight(c.size)]);
}
function makePortionTypeQFromCombo(c) {
  return { type: "Portion Recall", kind: "type", data: { ingredient: c.ingredient, unit: c.unit, context: `${c.size}" Pizza — ${c.tier}`, answer: String(c.answer) } };
}
function enumerateFlatCheeseCombos() {
  const combos = [];
  for (const item of FLAT_CHEESE) {
    for (const size of SIZES) {
      combos.push({ ingredient: item.name, unit: item.unit, size, answer: item.sizes[size] });
    }
  }
  return combos;
}
function weightedFlatCheeseCombos() {
  return enumerateFlatCheeseCombos().map((c) => [c, sizeWeight(c.size)]);
}
function makeFlatCheeseTypeQFromCombo(c) {
  return { type: "Portion Recall", kind: "type", data: { ingredient: c.ingredient, unit: c.unit, context: `${c.size}" Pizza — All Pizzas`, answer: String(c.answer) } };
}

function useCountdown(seconds, active, onExpire) {
  const [timeLeft, setTimeLeft] = useState(seconds);
  const expiredRef = useRef(false);

  useEffect(() => {
    setTimeLeft(seconds);
    expiredRef.current = false;
  }, [seconds, active]);

  useEffect(() => {
    if (!active) return;
    if (timeLeft <= 0) {
      if (!expiredRef.current) {
        expiredRef.current = true;
        onExpire();
      }
      return;
    }
    const t = setTimeout(() => setTimeLeft((v) => v - 1), 1000);
    return () => clearTimeout(t);
  }, [timeLeft, active, onExpire]);

  return timeLeft;
}

function TimerRing({ timeLeft, total }) {
  const pct = Math.max(0, timeLeft / total);
  const r = 26;
  const circ = 2 * Math.PI * r;
  const urgent = timeLeft <= 3;
  return (
    <div style={{ position: "relative", width: 64, height: 64, flexShrink: 0 }}>
      <svg width="64" height="64" viewBox="0 0 64 64" style={{ transform: "rotate(-90deg)" }}>
        <circle cx="32" cy="32" r={r} fill="none" stroke={C.track} strokeWidth="6" />
        <circle cx="32" cy="32" r={r} fill="none" stroke={urgent ? C.red : C.blue} strokeWidth="6" strokeDasharray={circ} strokeDashoffset={circ * (1 - pct)} strokeLinecap="round" style={{ transition: "stroke-dashoffset 1s linear, stroke 0.3s" }} />
      </svg>
      <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 900, fontSize: 18, color: urgent ? C.red : C.white, animation: urgent ? "pulse 1s infinite" : "none" }}>
        {timeLeft}
      </div>
    </div>
  );
}

function CodeTypeQuestion({ item, shellProps, onAnswer }) {
  const [value, setValue] = useState("");
  const [flash, setFlash] = useState(null);
  const [locked, setLocked] = useState(false);
  const inputRef = useRef(null);
  const revealAnswer = shellProps.revealAnswer;

  useEffect(() => { inputRef.current && inputRef.current.focus(); }, []);

  const submit = useCallback((val) => {
    if (locked) return;
    setLocked(true);
    const correct = val.trim().toUpperCase() === item.answer.toUpperCase();
    setFlash(correct ? "correct" : "wrong");
    setTimeout(() => onAnswer(correct), !correct && revealAnswer ? 1800 : 700);
  }, [locked, item.answer, onAnswer, revealAnswer]);

  const handleExpire = useCallback(() => submit(value), [submit, value]);
  const timeLeft = useCountdown(20, !locked, handleExpire);

  return (
    <QuestionShell {...shellProps}>
      <FeedbackFlash status={flash} correctAnswer={revealAnswer ? item.answer : null} />
      <div style={{ display: "flex", alignItems: "center", gap: 16, marginBottom: 24 }}>
        <TimerRing timeLeft={timeLeft} total={20} />
        <div>
          <p style={{ color: C.textMuted, fontSize: 12, textTransform: "uppercase", letterSpacing: "0.05em", fontWeight: 700, margin: 0 }}>Type the code for</p>
          <p style={{ fontSize: 26, fontWeight: 900, color: C.white, margin: 0 }}>{item.name}</p>
        </div>
      </div>
      <input
        ref={inputRef}
        value={value}
        onChange={(e) => setValue(e.target.value)}
        onKeyDown={(e) => { if (e.key === "Enter") submit(value); }}
        disabled={locked}
        maxLength={10}
        style={{ width: "100%", background: C.panel, border: `2px solid ${C.panelBorder}`, borderRadius: 6, padding: "16px", color: C.white, fontSize: 28, fontWeight: 900, letterSpacing: "0.3em", textAlign: "center", textTransform: "uppercase", outline: "none" }}
        placeholder="CODE"
      />
      <button type="button" onClick={() => submit(value)} disabled={locked} style={{ marginTop: 16, width: "100%", background: C.blue, color: "white", fontWeight: 700, padding: "12px 0", borderRadius: 4, border: "none", cursor: locked ? "default" : "pointer", opacity: locked ? 0.6 : 1, fontSize: 16 }}>
        Submit
      </button>
    </QuestionShell>
  );
}

function Results({ results, mode, onRestart, onPass, onRetryMissed }) {
  const total = results.length;
  const correct = results.filter((r) => r.correct).length;
  const pct = total > 0 ? Math.round((correct / total) * 100) : 0;
  const isCertMode = mode === "newhire" || mode === "csr" || mode === "onboarding" || mode === "sweetheat" || mode === "mit1";
  const pass = isCertMode ? pct >= 90 : mode === "retry" ? pct === 100 : true;
  const missed = results.filter((r) => !r.correct && r.question);

  useEffect(() => {
    if ((mode === "newhire" || mode === "onboarding" || mode === "mit1") && pass && onPass) onPass();
  }, [mode, pass, onPass]);

  const title = mode === "retry"
    ? (missed.length === 0 ? "All Cleaned Up!" : "Retry Complete")
    : isCertMode ? (pass ? "Test Passed" : "Not Yet — Retake Needed") : "Practice Session Complete";
  const subtitle = mode === "retry" ? "Missed Question Retry" : mode === "endless" ? "Endless Practice" : `${certModeLabel(mode)} Test`;

  return (
    <div style={{ minHeight: "100vh", padding: "40px 24px", background: C.bg }}>
      <div style={{ maxWidth: 512, margin: "0 auto" }}>
        <div style={{ textAlign: "center", marginBottom: 32 }}>
          <div style={{ width: 96, height: 96, borderRadius: "50%", margin: "0 auto 16px", display: "flex", alignItems: "center", justifyContent: "center", border: `4px solid ${pass ? C.green : C.red}`, background: pass ? C.greenSoft : C.redSoft }}>
            <span style={{ fontSize: 30, fontWeight: 900, color: C.white }}>{pct}%</span>
          </div>
          <h1 style={{ fontSize: 24, fontWeight: 900, color: C.white, margin: "0 0 4px" }}>{title}</h1>
          <p style={{ color: C.textMuted, fontSize: 14, margin: 0 }}>{correct} of {total} correct · {subtitle}</p>
        </div>

        <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 24, maxHeight: 320, overflowY: "auto" }}>
          {results.map((r, i) => (
            <div key={i} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", background: C.panelDim, borderRadius: 4, padding: "8px 12px", fontSize: 14 }}>
              <span style={{ color: C.textMuted }}>Q{i + 1} · {r.type}</span>
              <span>{r.correct ? "✅" : "❌"}</span>
            </div>
          ))}
        </div>

        {missed.length > 0 && (mode === "endless" || mode === "retry") && (
          <button
            onClick={() => onRetryMissed(missed.map((r) => r.question))}
            style={{ width: "100%", background: C.purpleSoft, color: C.purple, fontWeight: 700, padding: "12px 0", borderRadius: 4, border: `1px solid ${C.purple}`, cursor: "pointer", marginBottom: 10, fontSize: 16 }}
          >
            Retry the {missed.length} You Missed
          </button>
        )}

        <button onClick={onRestart} style={{ width: "100%", background: C.blue, color: "white", fontWeight: 700, padding: "12px 0", borderRadius: 4, border: "none", cursor: "pointer", fontSize: 16 }}>
          {mode === "onboarding" ? "Back to CSR Path" : mode === "mit1" ? "Back to MIT Level 1" : "Back to Dashboard"}
        </button>
      </div>
    </div>
  );
}

function renderQuestion(q, shellProps, onAnswer) {
  const key = shellProps.index;
  if (q.kind === "type" && q.type === "Code Recall") return <CodeTypeQuestion key={key} item={q.data} shellProps={shellProps} onAnswer={onAnswer} />;
  if (q.kind === "mc" && q.type === "Ticket Reading") return <CodeMCQuestion key={key} item={q.data} shellProps={shellProps} onAnswer={onAnswer} />;
  if (q.kind === "type" && q.type === "Ticket Reading") return <CodeNameTypeQuestion key={key} item={q.data} shellProps={shellProps} onAnswer={onAnswer} />;
  if (q.kind === "mc" && q.type === "Crust & Size") return <CrustMCQuestion key={key} item={q.data} shellProps={shellProps} onAnswer={onAnswer} />;
  if (q.kind === "type" && q.type === "Crust & Size") return <CrustTypeQuestion key={key} item={q.data} shellProps={shellProps} onAnswer={onAnswer} />;
  if (q.kind === "mc" && q.type === "Portion Recall") return <PortionMCQuestion key={key} item={q.data} shellProps={shellProps} onAnswer={onAnswer} />;
  if (q.kind === "mc" && q.type === "Policy") return <PolicyMCQuestion key={key} item={q.data} shellProps={shellProps} onAnswer={onAnswer} />;
  if (q.kind === "type" && q.type === "Portion Recall") return <PortionTypeQuestion key={key} item={q.data} shellProps={shellProps} onAnswer={onAnswer} />;
  if (q.kind === "build") return <BuildQuestion key={key} item={q.data} shellProps={shellProps} onAnswer={onAnswer} />;
  return null;
}

  const [endlessQueue, setEndlessQueue] = useState([]);
  const [certQuestions, setCertQuestions] = useState(null);
  const [progress, setProgress] = useState(() => loadProgress());
  const [enabledCategories, setEnabledCategories] = useState(DEFAULT_ENABLED_CATEGORIES);
  const [isDark, setIsDark] = useState(function () {
    try { return localStorage.getItem("storeup-dark") === "1"; } catch (e) { return false; }
  });
  const [seenTimerWarning, setSeenTimerWarning] = useState(() => hasSeenTimerWarning());
  const [pendingStartFn, setPendingStartFn] = useState(null);
  const [resumeState, setResumeStateVal] = useState(() => loadResumeState());
  const [hubModule, setHubModule] = useState(null);
  const [mit, setMit] = useState(() => loadMit());
  const [mitSectionKey, setMitSectionKey] = useState(null);
  const [preTimerWarningScreen, setPreTimerWarningScreen] = useState("dashboard");

  applyTheme(isDark);

  useEffect(function () {
    try { localStorage.setItem("storeup-dark", isDark ? "1" : "0"); } catch (e) { /* ignore */ }
  }, [isDark]);

  const markProgress = useCallback((key) => {
    setProgress((prev) => {
      if (prev[key]) return prev;
      const next = { ...prev, [key]: true };
      saveProgress(next);
      return next;
    });
  }, []);

  const updateMit = (fn) => setMit((prev) => { const next = fn(prev); saveMit(next); return next; });
  const addTrainee = (name) => updateMit((m) => { const id = "t" + Date.now(); return { trainees: [...m.trainees, { id, name, items: {}, quiz: {}, testPassed: false }], activeId: id }; });
  const selectTrainee = (id) => updateMit((m) => ({ ...m, activeId: id }));
  const removeTrainee = (id) => updateMit((m) => { const trainees = m.trainees.filter((t) => t.id !== id); return { trainees, activeId: trainees.length ? trainees[0].id : null }; });
  const toggleMitItem = (itemId, key) => updateMit((m) => ({ ...m, trainees: m.trainees.map((t) => { if (t.id !== m.activeId) return t; const cur = (t.items && t.items[itemId]) || {}; return { ...t, items: { ...t.items, [itemId]: { ...cur, [key]: !cur[key] } } }; }) }));
  const setMitQuiz = (sectionKey, pct) => updateMit((m) => ({ ...m, trainees: m.trainees.map((t) => t.id === m.activeId ? { ...t, quiz: { ...t.quiz, [sectionKey]: pct } } : t) }));
  const markMitPassed = useCallback(() => updateMit((m) => ({ ...m, trainees: m.trainees.map((t) => t.id === m.activeId ? { ...t, testPassed: true } : t) })), []);
  const activeTrainee = mit.trainees.find((t) => t.id === mit.activeId) || null;

  const newHirePassed = !!progress.newHirePassed;
  const onboardingPassed = !!progress.onboardingPassed;

  const toggleCategory = (key) => {
    setEnabledCategories((prev) => {
      const activeCount = Object.values(prev).filter(Boolean).length;
      if (prev[key] && activeCount <= 1) return prev;
      return { ...prev, [key]: !prev[key] };
    });
  };

  const beginCert = (m, questions) => {
    clearResumeState();
    setResumeStateVal(null);
    setMode(m);
    setQIndex(0);
    setResults([]);
    setCertQuestions(questions);
    setScreen("quiz");
  };

  const startStudy = () => setScreen("studyguide");
  const finishStudy = () => { markProgress("studyGuideViewed"); setScreen("dashboard"); };
  const startNewHire = () => { setHubModule(null); beginCert("newhire", generateNewHireCert()); };
  const startCSR = () => {
    if (!newHirePassed || !onboardingPassed) return;
    setHubModule(null);
    beginCert("csr", generateCSRCert());
  };
  const startOnboarding = () => beginCert("onboarding", generateDay1OnboardingCert());
  const startSweetHeat = () => beginCert("sweetheat", generateSweetHeatCert());
  const startMit = () => { if (!mitAllSigned(activeTrainee)) return; beginCert("mit1", generateMitLevel1Cert()); };
  const openMit = () => setScreen("mithub");

  const openOnboarding = () => { setHubModule("onboarding"); setScreen("modulehub"); };
  const openSweetHeat = () => { setHubModule("sweetheat"); setScreen("modulehub"); };
  const openCSRPath = () => setScreen("csrhub");
  const finishModuleStudy = (key) => { markProgress(key); setScreen("modulehub"); };

  const startEndless = () => {
    setHubModule(null);
    setMode("endless");
    setQIndex(0);
    setResults([]);
    setEndlessQueue([generateRandomQuestion(enabledCategories)]);
    setScreen("quiz");
  };

  const startRetry = (missedQuestions) => {
    setMode("retry");
    setQIndex(0);
    setResults([]);
    setCertQuestions(missedQuestions);
    setScreen("quiz");
  };

  const guardedStart = (fn) => () => {
    if (seenTimerWarning) { fn(); return; }
    setPendingStartFn(() => fn);
    setPreTimerWarningScreen(screen);
    setScreen("timerwarning");
  };
  const acknowledgeTimerWarning = () => {
    markTimerWarningSeen();
    setSeenTimerWarning(true);
    const fn = pendingStartFn;
    setPendingStartFn(null);
    if (fn) fn();
  };

  const resumeCert = () => {
    if (!resumeState) return;
    setMode(resumeState.mode);
    setCertQuestions(resumeState.certQuestions);
    setQIndex(resumeState.qIndex);
    setResults(resumeState.results);
    setScreen("quiz");
  };
  const discardResume = () => {
    clearResumeState();
    setResumeStateVal(null);
  };

  const isResumableCert = mode === "newhire" || mode === "csr" || mode === "onboarding" || mode === "sweetheat" || mode === "mit1";
  const fixedQuestions = isResumableCert || mode === "retry" ? certQuestions : null;
  const currentQuestion = fixedQuestions ? fixedQuestions[qIndex] : endlessQueue[qIndex];

  const handleAnswer = (correct) => {
    const q = currentQuestion;
    const next = [...results, { type: q.type, correct, question: q }];
    setResults(next);
    if (fixedQuestions) {
      const nextIndex = qIndex + 1;
      if (nextIndex < fixedQuestions.length) {
        setQIndex(nextIndex);
        if (isResumableCert) saveResumeState(mode, fixedQuestions, nextIndex, next);
      } else {
        if (isResumableCert) {
          clearResumeState();
          setResumeStateVal(null);
        }
        setScreen("results");
      }
    } else {
      setEndlessQueue((prev) => [...prev, generateNonRepeatingQuestion(q, enabledCategories)]);
      setQIndex(qIndex + 1);
    }
  };

  const endSession = () => setScreen("results");
  const onPass = useCallback(() => {
    if (mode === "newhire") markProgress("newHirePassed");
    if (mode === "onboarding") markProgress("onboardingPassed");
    if (mode === "mit1") markMitPassed();
  }, [mode, markProgress, markMitPassed]);

  const correctCount = results.filter((r) => r.correct).length;
  const wrongCount = results.length - correctCount;
  const sweetHeatActive = sweetHeatLaunchActive();
  const hubStudyKey = hubModule === "onboarding" ? "onboardingStudyViewed" : "sweetHeatStudyViewed";

  const known =
    screen === "dashboard" ||
    screen === "studyguide" ||
    screen === "csrhub" ||
    (screen === "modulehub" && !!hubModule) ||
    screen === "onboardingstudy" ||
    screen === "sweetheatstudy" ||
    screen === "mithub" ||
    (screen === "mitsection" && !!mitSectionKey && !!activeTrainee) ||
    screen === "timerwarning" ||
    (screen === "quiz" && !!currentQuestion) ||
    screen === "results";

  return (
    <div style={{ width: "100%", minHeight: "100vh" }}>
      {screen === "dashboard" && (
        <Dashboard
          studyGuideViewed={!!progress.studyGuideViewed}
          newHirePassed={newHirePassed}
          isDark={isDark}
          onToggleDark={() => setIsDark((d) => !d)}
          onStartStudy={startStudy}
          onStartNewHire={guardedStart(startNewHire)}
          onOpenCSRPath={openCSRPath}
          onStartEndless={guardedStart(startEndless)}
          showSweetHeat={sweetHeatActive}
          onOpenSweetHeat={openSweetHeat}
          onOpenMit={openMit}
          resumeState={resumeState}
          onResume={resumeCert}
          onDiscardResume={discardResume}
        />
      )}
      {screen === "studyguide" && <StudyGuide cards={STUDY_CARDS} onFinish={finishStudy} onExit={() => setScreen("dashboard")} />}
      {screen === "csrhub" && (
        <CSRPathHub
          onboardingPassed={onboardingPassed}
          onOpenOnboarding={openOnboarding}
          onTest={guardedStart(startCSR)}
          onBack={() => setScreen("dashboard")}
        />
      )}
      {screen === "modulehub" && hubModule && (
        <ModuleHub
          module={hubModule}
          studyViewed={!!progress[hubStudyKey]}
          onStudy={() => setScreen(hubModule === "onboarding" ? "onboardingstudy" : "sweetheatstudy")}
          onTest={guardedStart(hubModule === "onboarding" ? startOnboarding : startSweetHeat)}
          onBack={() => { const dest = hubModule === "onboarding" ? "csrhub" : "dashboard"; setHubModule(null); setScreen(dest); }}
        />
      )}
      {screen === "onboardingstudy" && (
        <ReferenceStudyGuide eyebrow="Day 1 Onboarding" cards={ONBOARDING_REFERENCE_CARDS} onFinish={() => finishModuleStudy("onboardingStudyViewed")} onExit={() => setScreen("modulehub")} />
      )}
      {screen === "sweetheatstudy" && (
        <StudyGuide cards={SWEET_HEAT_STUDY_CARDS} accent={C.red} onFinish={() => finishModuleStudy("sweetHeatStudyViewed")} onExit={() => setScreen("modulehub")} />
      )}
      {screen === "mithub" && (
        <MitHub
          mit={mit}
          onAddTrainee={addTrainee}
          onSelectTrainee={selectTrainee}
          onRemoveTrainee={removeTrainee}
          onOpenSection={(k) => { setMitSectionKey(k); setScreen("mitsection"); }}
          onTest={guardedStart(startMit)}
          onBack={() => setScreen("dashboard")}
        />
      )}
      {screen === "mitsection" && mitSectionKey && activeTrainee && (
        <MitSection
          key={mitSectionKey + activeTrainee.id}
          section={MIT_SECTIONS.find((x) => x.key === mitSectionKey)}
          trainee={activeTrainee}
          onToggle={toggleMitItem}
          onQuizDone={setMitQuiz}
          onBack={() => setScreen("mithub")}
        />
      )}
      {screen === "timerwarning" && (
        <TimerWarningScreen onContinue={acknowledgeTimerWarning} onBack={() => { setPendingStartFn(null); setScreen(preTimerWarningScreen); }} />
      )}
      {screen === "quiz" && currentQuestion && renderQuestion(
        currentQuestion,
        { index: qIndex, total: fixedQuestions ? fixedQuestions.length : null, correctCount, wrongCount, onEndSession: mode === "endless" ? endSession : null, extraHeader: mode === "endless" ? <CategoryToggles enabled={enabledCategories} onToggle={toggleCategory} /> : null, revealAnswer: mode === "endless" || mode === "retry" },
        handleAnswer
      )}
      {screen === "results" && (
        <Results
          results={results}
          mode={mode}
          onRestart={() => setScreen(mode === "onboarding" ? "csrhub" : mode === "mit1" ? "mithub" : "dashboard")}
          onPass={onPass}
          onRetryMissed={startRetry}
        />
      )}
      {!known && <BrokenStateScreen onHome={() => setScreen("dashboard")} />}
    </div>
  );
}

function generateMitLevel1Cert() {
  const all = [];
  MIT_SECTIONS.forEach((sec) => {
    (MIT_QUIZ[sec.key] || []).forEach((q) => all.push({ ...q, category: sec.title }));
  });
  return sampleWithoutReplacement(all, 20).map((q) => ({ type: "Policy", kind: "mc", data: { prompt: q.prompt, answer: q.answer, choices: shuffle(q.choices), category: q.category } }));
}
const MIT_TEST_COUNT = 20;

function mitSectionProgress(trainee, section) {
  const done = section.items.filter((it) => trainee && trainee.items && trainee.items[it.id] && trainee.items[it.id].ts).length;
  return { done, total: section.items.length };
}
function mitAllSigned(trainee) {
  return !!trainee && MIT_SECTIONS.every((s) => { const p = mitSectionProgress(trainee, s); return p.done === p.total; });
}

  const shuffled = useMemo(() => questions.map((q) => ({ ...q, choices: shuffle(q.choices) })), [questions]);
  const q = shuffled[i];
  const pct = Math.round((correct / shuffled.length) * 100);

  const choose = (c) => {
    if (picked !== null) return;
    setPicked(c);
    if (c === q.answer) setCorrect((n) => n + 1);
  };
  const next = () => {
    if (i + 1 >= shuffled.length) { setDone(true); return; }
    setI(i + 1);
    setPicked(null);
  };

  return (
    <div style={{ minHeight: "100vh", padding: "40px 24px", background: C.bg }}>
      <div style={{ maxWidth: 512, margin: "0 auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
          <p style={{ color: C.textMuted, fontSize: 12, textTransform: "uppercase", letterSpacing: "0.05em", fontWeight: 700, margin: 0 }}>{title} · practice quiz</p>
          <button onClick={onExit} style={{ background: "none", border: `1px solid ${C.panelBorder}`, color: C.textMuted, fontSize: 11, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.05em", padding: "4px 10px", borderRadius: 6, cursor: "pointer" }}>← Back</button>
        </div>
        {!done ? (
          <React.Fragment>
            <p style={{ color: C.textFaint, fontSize: 12, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.05em", margin: "0 0 8px" }}>Question {i + 1} of {shuffled.length} · no timer</p>
            <p style={{ fontSize: 19, fontWeight: 700, color: C.white, lineHeight: 1.4, marginBottom: 20 }}>{q.prompt}</p>
            <div style={{ display: "grid", gap: 10 }}>
              {q.choices.map((c) => {
                const isAnswer = c === q.answer;
                const isPicked = c === picked;
                const show = picked !== null;
                const border = show ? (isAnswer ? C.green : isPicked ? C.red : C.panelBorder) : C.panelBorder;
                const bg = show ? (isAnswer ? C.greenSoft : isPicked ? C.redSoft : C.panel) : C.panel;
                return (
                  <button key={c} onClick={() => choose(c)} disabled={show} style={{ textAlign: "left", padding: "14px 16px", borderRadius: 6, background: bg, border: `2px solid ${border}`, color: C.white, fontWeight: 600, cursor: show ? "default" : "pointer" }}>{c}</button>
                );
              })}
            </div>
            {picked !== null && (
              <div style={{ marginTop: 16, background: picked === q.answer ? C.greenSoft : C.redSoft, border: `1px solid ${picked === q.answer ? C.green : C.red}`, borderRadius: 6, padding: 14 }}>
                <p style={{ color: C.white, fontWeight: 800, margin: "0 0 4px", fontSize: 14 }}>{picked === q.answer ? "Right." : "Not quite."}</p>
                <p style={{ color: C.white, fontSize: 14, lineHeight: 1.5, margin: 0 }}>{q.why}</p>
              </div>
            )}
            {picked !== null && (
              <button onClick={next} style={{ width: "100%", marginTop: 16, background: C.blue, color: "white", fontWeight: 700, fontSize: 16, padding: "13px 0", borderRadius: C.btnRadius, border: "none", cursor: "pointer" }}>{i + 1 >= shuffled.length ? "See my score" : "Next →"}</button>
            )}
          </React.Fragment>
        ) : (
          <div style={{ textAlign: "center", paddingTop: 20 }}>
            <div style={{ width: 96, height: 96, borderRadius: "50%", margin: "0 auto 16px", display: "flex", alignItems: "center", justifyContent: "center", border: `4px solid ${pct >= 90 ? C.green : C.red}`, background: pct >= 90 ? C.greenSoft : C.redSoft }}>
              <span style={{ fontSize: 30, fontWeight: 900, color: C.white }}>{pct}%</span>
            </div>
            <h2 style={{ color: C.white, fontSize: 22, fontWeight: 900, margin: "0 0 4px" }}>{correct} of {shuffled.length} correct</h2>
            <p style={{ color: C.textMuted, fontSize: 14, marginBottom: 20 }}>{pct >= 90 ? "Solid. This section is ready." : "Go back over the items you missed with your trainer, then try again."}</p>
            <button onClick={() => onFinish(pct)} style={{ width: "100%", background: C.blue, color: "white", fontWeight: 700, fontSize: 16, padding: "13px 0", borderRadius: C.btnRadius, border: "none", cursor: "pointer", marginBottom: 10 }}>Save score and go back</button>
            <button onClick={() => { setI(0); setPicked(null); setCorrect(0); setDone(false); }} style={{ width: "100%", background: "transparent", color: C.textMuted, fontWeight: 700, fontSize: 14, padding: "10px 0", borderRadius: C.btnRadius, border: `1px solid ${C.panelBorder}`, cursor: "pointer" }}>Retry quiz</button>
          </div>
        )}
      </div>
    </div>
  );
}

function MitSection({ section, trainee, onToggle, onQuizDone, onBack }) {
  const [i, setI] = useState(0);
  const [hits, setHits] = useState({});
  const [mode, setMode] = useState("walk");
  const item = section.items[i];
  const isLast = i === section.items.length - 1;
  const rec = (trainee.items && trainee.items[item.id]) || {};

  if (mode === "quiz") {
    return <MitGuidedQuiz title={section.title} questions={MIT_QUIZ[section.key] || []} onFinish={(pct) => { onQuizDone(section.key, pct); setMode("walk"); }} onExit={() => setMode("walk")} />;
  }

  const toggleHit = (idx) => setHits((h) => { const key = item.id + ":" + idx; return { ...h, [key]: !h[key] }; });
  const signBtn = (key, label) => {
    const on = !!rec[key];
    return (
      <button onClick={() => onToggle(item.id, key)} style={{ flex: 1, padding: "12px 8px", borderRadius: 6, fontWeight: 800, fontSize: 14, border: `2px solid ${on ? C.green : C.panelBorder}`, background: on ? C.green : "transparent", color: on ? "white" : C.textMuted, cursor: "pointer" }}>{on ? "✓ " : ""}{label}</button>
    );
  };
  const bullets = (list) => list.map((line, idx) => (
    <div key={idx} style={{ background: C.panel, border: `1px solid ${C.panelBorder}`, borderRadius: C.cardRadius, padding: "10px 14px", marginBottom: 8 }}>
      <p style={{ color: C.white, fontSize: 14, lineHeight: 1.5, margin: 0 }}>{line}</p>
    </div>
  ));

  return (
    <div style={{ minHeight: "100vh", padding: "40px 24px", display: "flex", flexDirection: "column", background: C.bg }}>
      <div style={{ maxWidth: 512, margin: "0 auto", width: "100%", flex: 1, display: "flex", flexDirection: "column" }}>
        <div style={{ marginBottom: 20 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 12, color: C.textFaint, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.05em", marginBottom: 6 }}>
            <span>{trainee.name} · Item {i + 1} of {section.items.length}</span>
            <button onClick={onBack} style={{ background: "none", border: `1px solid ${C.panelBorder}`, color: C.textMuted, fontSize: 11, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.05em", padding: "4px 10px", borderRadius: 6, cursor: "pointer" }}>← Sections</button>
          </div>
          <div style={{ height: 6, background: C.track, borderRadius: 6, overflow: "hidden" }}>
            <div style={{ height: "100%", background: C.blue, transition: "width 0.3s", width: `${((i + 1) / section.items.length) * 100}%` }} />
          </div>
        </div>

        <div style={{ flex: 1 }}>
          <p style={{ color: C.textMuted, fontSize: 12, textTransform: "uppercase", letterSpacing: "0.05em", fontWeight: 700, marginBottom: 4 }}>{section.title}</p>
          <h2 style={{ fontFamily: C.displayFont, color: C.white, fontSize: 26, fontWeight: 800, textTransform: "uppercase", margin: "0 0 16px" }}>{item.title}</h2>

          {item.tm ? (
            <React.Fragment>
              <p style={{ color: C.textMuted, fontSize: 12, textTransform: "uppercase", letterSpacing: "0.05em", fontWeight: 700, margin: "0 0 8px" }}>Manager</p>
              {bullets(item.points)}
              <p style={{ color: C.textMuted, fontSize: 12, textTransform: "uppercase", letterSpacing: "0.05em", fontWeight: 700, margin: "14px 0 8px" }}>Team member(s)</p>
              {bullets(item.tm)}
            </React.Fragment>
          ) : (
            <React.Fragment>
              <p style={{ color: C.textMuted, fontSize: 12, textTransform: "uppercase", letterSpacing: "0.05em", fontWeight: 700, margin: "0 0 8px" }}>What good looks like</p>
              {bullets(item.points)}
            </React.Fragment>
          )}

          {item.show && (
            <div style={{ background: C.blueSoft, border: `2px solid ${C.blue}`, borderRadius: C.cardRadius, padding: 14, margin: "16px 0 8px" }}>
              <p style={{ color: C.blue, fontSize: 12, textTransform: "uppercase", letterSpacing: "0.05em", fontWeight: 800, margin: "0 0 4px" }}>Trainer — show it, then have them do it</p>
              <p style={{ color: C.white, fontSize: 14, lineHeight: 1.5, margin: 0 }}>{item.show}</p>
            </div>
          )}

          {item.skill && (
            <div style={{ background: C.purpleSoft, border: `2px solid ${C.purple}`, borderRadius: C.cardRadius, padding: 14, margin: "16px 0 8px" }}>
              <p style={{ color: C.purple, fontSize: 12, textTransform: "uppercase", letterSpacing: "0.05em", fontWeight: 800, margin: "0 0 6px" }}>{item.skill.title}</p>
              <p style={{ color: C.white, fontSize: 14, lineHeight: 1.5, margin: "0 0 10px" }}>{item.skill.prompt}</p>
              <p style={{ color: C.textMuted, fontSize: 12, fontWeight: 700, margin: "0 0 6px" }}>Tap each one the trainee hits:</p>
              {item.skill.hit.map((h, idx) => {
                const on = !!hits[item.id + ":" + idx];
                return (
                  <button key={idx} onClick={() => toggleHit(idx)} style={{ display: "flex", alignItems: "center", gap: 10, width: "100%", textAlign: "left", padding: "10px 12px", marginBottom: 6, borderRadius: 6, border: `1px solid ${on ? C.green : C.panelBorder}`, background: on ? C.greenSoft : C.panel, color: C.white, fontWeight: 600, fontSize: 14, cursor: "pointer" }}>
                    <span style={{ width: 18, height: 18, borderRadius: 4, border: `2px solid ${on ? C.green : C.textFaint}`, background: on ? C.green : "transparent", color: "white", fontSize: 12, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>{on ? "✓" : ""}</span>
                    {h}
                  </button>
                );
              })}
            </div>
          )}
        </div>

        <div style={{ marginTop: 20 }}>
          <p style={{ color: C.textFaint, fontSize: 11, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.05em", margin: "0 0 6px" }}>Sign-off (same as the paper sheet)</p>
          <div style={{ display: "flex", gap: 10, marginBottom: 14 }}>
            {signBtn("ts", "TS — Trainer")}
            {signBtn("gm", "GM — Approved")}
          </div>
          <div style={{ display: "flex", gap: 10 }}>
            <button onClick={() => setI((v) => Math.max(0, v - 1))} disabled={i === 0} style={{ flex: 1, background: C.panel, border: `1px solid ${C.panelBorder}`, color: C.white, fontWeight: 700, padding: "12px 0", borderRadius: 4, cursor: i === 0 ? "default" : "pointer", opacity: i === 0 ? 0.4 : 1, fontSize: 15 }}>← Back</button>
            {isLast ? (
              <button onClick={() => setMode("quiz")} style={{ flex: 2, background: C.green, border: "none", color: "white", fontWeight: 700, padding: "12px 0", borderRadius: 4, cursor: "pointer", fontSize: 15 }}>Section quiz →</button>
            ) : (
              <button onClick={() => setI((v) => Math.min(section.items.length - 1, v + 1))} style={{ flex: 2, background: C.blue, border: "none", color: "white", fontWeight: 700, padding: "12px 0", borderRadius: 4, cursor: "pointer", fontSize: 15 }}>Next →</button>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

function TimerWarningScreen({ onContinue, onBack }) {
  return (
    <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", padding: "48px 20px", background: C.bg }}>
      <div style={{ width: "100%", maxWidth: 400, background: C.panel, border: `2px solid ${C.panelBorder}`, borderRadius: C.cardRadius, padding: 30, textAlign: "center" }}>
        <p style={{ fontSize: 40, margin: "0 0 12px" }}>⏱</p>
        <h1 style={{ fontFamily: C.displayFont, fontSize: 26, fontWeight: 800, color: C.white, margin: "0 0 10px", textTransform: "uppercase" }}>Heads Up — It's Timed</h1>
        <p style={{ color: C.textMuted, fontSize: 14, marginBottom: 20, lineHeight: 1.6 }}>
          Most questions give you 20 seconds to answer. Specialty build questions aren't timed at all — take your time on those. Don't worry about missing a few — that's normal. Just keep moving.
        </p>
        <button onClick={onContinue} style={{ width: "100%", background: C.blue, color: "white", fontWeight: 800, fontSize: 15, padding: "13px 0", borderRadius: C.btnRadius, border: "none", cursor: "pointer", marginBottom: 10 }}>
          Got It — Let's Go
        </button>
        <button onClick={onBack} style={{ width: "100%", background: "transparent", color: C.textMuted, fontWeight: 700, fontSize: 14, padding: "10px 0", borderRadius: C.btnRadius, border: "none", cursor: "pointer" }}>
          ← Not Yet
        </button>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
